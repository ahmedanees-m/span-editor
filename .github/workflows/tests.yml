name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev]"

      - name: Test
        run: python -m pytest -q

      - name: Source count
        run: python analysis/count_sources.py

      - name: Synthetic recovery
        run: python analysis/synthetic_recovery.py --quick --out results/ci_recovery.json
